<div class="dashboard">

  <app-sidebar role="admin" email="admin@mediasoft.fr"></app-sidebar>

  <main class="content">
    <header class="page-header">
      <h1>Reporting</h1>
      <p>Analyse et statistiques des factures · 3 derniers mois</p>
    </header>

    <!-- KPI strip -->
    <div class="report-stats">
      <div class="rstat">
        <div class="rstat-ico">📄</div>
        <div>
          <span class="rstat-label">Total factures</span>
          <span class="rstat-value">5 <span class="change up">+12%</span></span>
        </div>
      </div>
      <div class="rstat">
        <div class="rstat-ico">💰</div>
        <div>
          <span class="rstat-label">Montant total</span>
          <span class="rstat-value">57 k€ <span class="change up">+8%</span></span>
        </div>
      </div>
      <div class="rstat">
        <div class="rstat-ico">✔️</div>
        <div>
          <span class="rstat-label">Taux validation</span>
          <span class="rstat-value">20% <span class="change up">+5%</span></span>
        </div>
      </div>
      <div class="rstat">
        <div class="rstat-ico">⏱️</div>
        <div>
          <span class="rstat-label">Délai moyen</span>
          <span class="rstat-value">2.3j <span class="change down">+0.5j</span></span>
        </div>
      </div>
    </div>

    <!-- Charts -->
    <div class="charts-grid">
      <div class="chart-card">
        <h3>Répartition par statut</h3>
        <div class="chart-box">
          <canvas baseChart [data]="statusChartData" [type]="statusChartType" [options]="statusChartOptions"></canvas>
        </div>
      </div>

      <div class="chart-card">
        <h3>Évolution mensuelle</h3>
        <div class="chart-box">
          <canvas baseChart [data]="monthlyChartData" [type]="monthlyChartType" [options]="monthlyChartOptions"></canvas>
        </div>
      </div>

      <div class="chart-card wide">
        <h3>Top 5 fournisseurs</h3>
        <div class="chart-box">
          <canvas baseChart [data]="topSuppliersData" [type]="topSuppliersType" [options]="topSuppliersOptions"></canvas>
        </div>
      </div>
    </div>
  </main>
</div>
