<app-navbar></app-navbar>
<div class="page-content"><div class="reporting-page">

  <!-- HEADER -->
  <div class="page-header">
    <h2>Reporting</h2>
    <p>Synthèse financière et analyse des factures</p>
  </div>

  <!-- LOADING -->
  <div *ngIf="loading" class="loading">
    Chargement...
  </div>

  <!-- KPI -->
  <div *ngIf="!loading" class="stats-grid">

    <div class="stat-card blue">
      <div class="stat-label">Total factures</div>
      <div class="stat-value">{{ report?.totalFactures }}</div>
    </div>

    <div class="stat-card green">
      <div class="stat-label">Total HT</div>
      <div class="stat-value">{{ report?.totalHT }} DT</div>
    </div>

    <div class="stat-card amber">
      <div class="stat-label">Total TTC</div>
      <div class="stat-value">{{ report?.totalTTC }} DT</div>
    </div>

    <div class="stat-card purple">
      <div class="stat-label">TVA</div>
      <div class="stat-value">{{ report?.totalTVA }} DT</div>
    </div>

  </div>

  <!-- CHARTS -->
  <div *ngIf="!loading && report" class="charts-grid">

    <!-- TOP FOURNISSEURS -->
    <div class="chart-card">
      <div class="chart-title">Top 5 fournisseurs</div>
      <canvas
        baseChart
        [data]="topSuppliersData"
        [type]="topSuppliersType"
        [options]="topSuppliersOptions">
      </canvas>
    </div>

    <!-- ÉVOLUTION MENSUELLE -->
    <div class="chart-card">
      <div class="chart-title">Évolution mensuelle</div>
      <canvas
        baseChart
        [data]="monthlyChartData"
        [type]="monthlyChartType"
        [options]="monthlyChartOptions">
      </canvas>
    </div>

  </div>
<div class="chart-card">
  <div class="chart-title">Statut des factures</div>

  <div class="status-chart">
    <canvas
      baseChart
      [data]="statusChartData"
      [type]="statusChartType"
      [options]="statusChartOptions">
    </canvas>
  </div>
</div>
