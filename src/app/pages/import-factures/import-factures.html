<div class="dashboard">

  <app-sidebar role="admin" email="admin@mediasoft.fr"></app-sidebar>

  <main class="content">
    <header class="page-header">
      <h1>Import de factures</h1>
      <p>Importez vos factures PDF avec extraction automatique des données</p>
    </header>

    <!-- UPLOAD -->
    <section class="import-section">
      <label class="dropzone" [class.has-file]="selectedFile">
        <div class="dz-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </div>
        <span class="dz-title">Cliquez pour sélectionner un fichier PDF</span>
        <span class="dz-hint">Format accepté : PDF uniquement (max 10 Mo)</span>
        <input type="file" (change)="onFileSelected($event)" accept="application/pdf" hidden>
      </label>

      <div class="file-info" *ngIf="selectedFile">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span><strong>{{ fileName }}</strong> · {{ fileSize }}</span>
        <span class="ok-tag">Extrait ✓</span>
      </div>
    </section>

    <!-- EXTRACTED DATA -->
    <section class="extracted-data" *ngIf="extractedData">
      <div class="ed-head">
        <h2>Données extraites</h2>
        <p>Vérifiez et modifiez les informations si nécessaire.</p>
      </div>

      <form class="invoice-form">
        <div class="form-row">
          <div class="form-group">
            <label>Fournisseur</label>
            <input [(ngModel)]="extractedData.supplier" name="supplier">
          </div>
          <div class="form-group">
            <label>N° Facture</label>
            <input [(ngModel)]="extractedData.invoiceNumber" name="invoiceNumber">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Date</label>
            <input type="date" [(ngModel)]="extractedData.date" name="date">
          </div>
          <div class="form-group">
            <label>Devise</label>
            <input [(ngModel)]="extractedData.currency" name="currency">
          </div>
        </div>

        <div class="form-row three">
          <div class="form-group">
            <label>Montant HT</label>
            <input type="number" [(ngModel)]="extractedData.amountHT" name="amountHT">
          </div>
          <div class="form-group">
            <label>TVA</label>
            <input type="number" [(ngModel)]="extractedData.tva" name="tva">
          </div>
          <div class="form-group">
            <label>Total TTC</label>
            <input type="number" [(ngModel)]="extractedData.total" name="total">
          </div>
        </div>

        <div class="form-group">
          <label>Statut</label>
          <select [(ngModel)]="extractedData.status" name="status">
            <option value="En attente">En attente</option>
            <option value="Validée">Validée</option>
            <option value="Rejetée">Rejetée</option>
            <option value="Synchronisée">Synchronisée</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="button" class="cancel" (click)="cancel()">Annuler</button>
          <button type="button" class="save" (click)="saveInvoice()">Enregistrer la facture</button>
        </div>
      </form>
    </section>
  </main>
</div>
