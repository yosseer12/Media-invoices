<div class="dashboard">

  <app-sidebar role="user" email="user@mediasoft.fr"></app-sidebar>

  <main class="content">
    <header>
      <h1>Mes factures</h1>
      <p>Suivez vos factures récentes en un coup d'œil</p>
    </header>

    <section class="table-section">
      <div class="section-head">
        <h3>Factures récentes</h3>
        <span class="count">{{ myInvoices.length }} facture(s)</span>
      </div>
      <table>
        <thead>
          <tr>
            <th>N° Facture</th>
            <th>Fournisseur</th>
            <th>Date</th>
            <th>Montant</th>
            <th>Statut</th>
            <th>Import</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let inv of myInvoices">
            <td class="mono">{{ inv.number }}</td>
            <td>{{ inv.supplier }}</td>
            <td>{{ inv.date }}</td>
            <td class="amount">{{ inv.amount }}</td>
            <td><span class="status" [ngClass]="inv.status.toLowerCase().replace(' ', '-')">{{ inv.status }}</span></td>
            <td><span class="chip">{{ inv.import }}</span></td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</div>
