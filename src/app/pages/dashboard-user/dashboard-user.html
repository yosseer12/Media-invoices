<div class="dashboard">

  <!-- Sidebar verticale simplifiée -->
  <aside class="sidebar">
    <div class="logo">MediaSoft</div>

    <ul class="nav-links">
      <li><a href="#">Dashboard</a></li>
      <li><a href="#">Liste des factures</a></li>
      <li><a href="#">Import facture</a></li>
    </ul>

    <div class="user-menu">
      <span>user@mediasoft.fr</span>
      <button class="logout">Déconnexion</button>
    </div>
  </aside>

  <!-- Contenu principal -->
  <main class="content">
    <header>
      <h1>Mes factures</h1>
      <p>Suivez vos factures récentes</p>
    </header>

    <div class="table-section">
      <table>
        <thead>
          <tr>
            <th>N° Facture</th>
            <th>Fournisseur</th>
            <th>Date</th>
            <th>Montant</th>
            <th>Statut</th>
            <th>Import</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let inv of myInvoices">
            <td>{{ inv.number }}</td>
            <td>{{ inv.supplier }}</td>
            <td>{{ inv.date }}</td>
            <td>{{ inv.amount }}</td>
            <td [ngClass]="inv.status.toLowerCase().replace(' ', '-')">{{ inv.status }}</td>
            <td>{{ inv.import }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
