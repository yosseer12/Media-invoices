<div class="login-page">
  <div class="login-box">
    <h1>MediaSoft Invoices Service</h1>
    <p>Connectez-vous à votre compte</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="input-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="vous@exemple.fr" required>
      </div>

      <div class="input-group">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••" required>
      </div>

      <button type="submit" [disabled]="loginForm.invalid">Se connecter</button>
    </form>

    <p class="switch">
      Pas encore de compte ? <a routerLink="/register">Créer un compte</a>
    </p>
  </div>
</div>
